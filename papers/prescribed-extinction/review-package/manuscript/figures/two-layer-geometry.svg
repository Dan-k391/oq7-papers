<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="title desc">
<title id="title">Finite two-layer dielectric and transverse axes</title>
<desc id="desc">The absorber lies between z=0 and z=h; the plate between z=h and z=h+d. Both have square aperture R by R. Plus incidence propagates upward from the absorber side; minus incidence downward from the plate side. Both electric polarizations are e_y. The plate active axis u_theta is rotated from e_x toward e_y. Not to scale.</desc>
<rect width="800" height="310" fill="white"/>
<text x="255" y="18" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">Finite body: (x,z) section</text>
<rect x="140" y="78" width="230" height="62" fill="#dcebe9" stroke="#25384a" stroke-width="1.4"/>
<rect x="140" y="140" width="230" height="66" fill="#f3e6d1" stroke="#25384a" stroke-width="1.4"/>
<text x="255" y="105" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">Plate</text>
<text x="255" y="123" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">active axis u_θ</text>
<text x="255" y="168" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">Absorber</text>
<text x="255" y="187" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">active axis e_x</text>
<line x1="370" y1="78" x2="398" y2="78" stroke="#25384a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="405" y="82" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="start">z = h+d</text>
<line x1="370" y1="140" x2="398" y2="140" stroke="#25384a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="405" y="144" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="start">z = h</text>
<line x1="370" y1="206" x2="398" y2="206" stroke="#25384a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="405" y="210" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="start">z = 0</text>
<text x="153" y="54" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="start">vacuum</text>
<text x="153" y="246" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="start">vacuum</text>
<line x1="82" y1="209" x2="82" y2="54" stroke="#25384a" stroke-width="1.6"/>
<polygon points="82.000,54.000 85.115,61.368 78.885,61.368" stroke="#25384a" stroke-width="1.4" fill="#25384a"/>
<text x="82" y="43" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">e_z</text>
<line x1="114" y1="78" x2="114" y2="140" stroke="#25384a" stroke-width="1.4"/>
<line x1="109" y1="78" x2="119" y2="78" stroke="#25384a" stroke-width="1.4"/>
<line x1="109" y1="140" x2="119" y2="140" stroke="#25384a" stroke-width="1.4"/>
<text x="102" y="114" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">d</text>
<line x1="114" y1="140" x2="114" y2="206" stroke="#25384a" stroke-width="1.4"/>
<line x1="109" y1="206" x2="119" y2="206" stroke="#25384a" stroke-width="1.4"/>
<text x="102" y="178" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">h</text>
<line x1="290" y1="28" x2="290" y2="69" stroke="#315c88" stroke-width="1.6"/>
<polygon points="290.000,69.000 286.885,61.632 293.115,61.632" stroke="#315c88" stroke-width="1.4" fill="#315c88"/>
<text x="307" y="37" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="start">− incidence</text>
<line x1="290" y1="259" x2="290" y2="215" stroke="#315c88" stroke-width="1.6"/>
<polygon points="290.000,215.000 293.115,222.368 286.885,222.368" stroke="#315c88" stroke-width="1.4" fill="#315c88"/>
<text x="307" y="252" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="start">+ incidence</text>
<line x1="140" y1="277" x2="370" y2="277" stroke="#25384a" stroke-width="1.4"/>
<line x1="140" y1="272" x2="140" y2="282" stroke="#25384a" stroke-width="1.4"/>
<line x1="370" y1="272" x2="370" y2="282" stroke="#25384a" stroke-width="1.4"/>
<text x="255" y="274" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">R</text>
<text x="255" y="301" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">Square aperture R × R in (x,y)</text>
<text x="628" y="35" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">Transverse axes</text>
<line x1="570" y1="199" x2="720" y2="199" stroke="#93632b" stroke-width="1.6"/>
<polygon points="720.000,199.000 712.632,202.115 712.632,195.885" stroke="#93632b" stroke-width="1.4" fill="#93632b"/>
<text x="740" y="204" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">e_x</text>
<line x1="570" y1="199" x2="570" y2="89" stroke="#315c88" stroke-width="1.6"/>
<polygon points="570.000,89.000 573.115,96.368 566.885,96.368" stroke="#315c88" stroke-width="1.4" fill="#315c88"/>
<text x="570" y="76" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">e_y</text>
<line x1="570" y1="199" x2="686.9134295108993" y2="131.5" stroke="#28736c" stroke-width="2"/>
<polygon points="686.913,131.500 682.090,137.882 678.974,132.486" stroke="#28736c" stroke-width="1.4" fill="#28736c"/>
<text x="697" y="127" fill="#28736c" font-family="Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle">u_θ</text>
<polyline points="614.000,199.000 613.973,197.464 613.893,195.931 613.759,194.401 613.572,192.876 613.332,191.359 613.038,189.852 612.693,188.355 612.296,186.872 611.846,185.403 611.346,183.951 610.796,182.517 610.196,181.104 609.547,179.712 608.850,178.343 608.105,177.000" stroke="#25384a" stroke-width="1" fill="none"/>
<text x="629" y="190" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">θ</text>
<text x="633" y="252" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">Incident polarization: e_y</text>
<text x="633" y="282" fill="#25384a" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Not to scale</text>
</svg>